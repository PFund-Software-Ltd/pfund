[workspace]
authors = ["softwareentrepreneer <softwareentrepreneer+pfund@gmail.com>"]
channels = ["conda-forge"]
name = "pfund"
# macos = min version of macOS required by torch>=2.12.0
platforms = [{ platform = "osx-arm64", macos = "14.0" }, "linux-aarch64", "linux-64", "win-64"]
# NOTE: should match with setup-pixi in ci.yml
requires-pixi = ">=0.84.1"
# FIXME: set it back to "14 days" when the package is stable
exclude-newer = "0d"

[workspace.pypi-exclude-newer]
exemptions = { afterpython = "*", uv_build = "*", pfund-blocks = "*", pfund-kit = "*", pfeed = "*", mtflow = "*" }

[tasks]
rmtree = { cmd = "scripts/worktree-remove.sh {{ name }}", args = ["name"] }

[tasks.test-all]
depends-on = [
  { task = "test", environment = "py313" },
  { task = "test", environment = "py314" },
  { task = "test", environment = "py315" },
]

[environments]
default = ["py313", "dev", "test", "optional"]
py313 = ["py313", "test", "optional"]
py314 = ["py314", "test", "optional"]
py315 = ["py315", "test", "optional"]

# links .venv -> .pixi/envs/default on activation, so that ty and afterpython's hooks
# (which look for the project environment in .venv/) use pixi's default environment,
# also in git GUIs where no pixi environment is active. See scripts/link-venv.sh
[target.unix.activation]
scripts = ["scripts/link-venv.sh"]

[dependencies]

# [pypi-options]
# prerelease-mode = "allow"

[pypi-dependencies]
pfeed = ">=0.0.23"
# mtflow = ">=0.0.1.dev2"
apscheduler = ">=3.11.3"
numba = ">=0.68.1"

[feature.optional.pypi-dependencies]
# TODO: remove the env-markers when ray supports python 3.15
pfeed = { version = ">=0.0.23", extras = ["ray"], env-markers = "python_version < '3.15'" }
ta-lib = ">=0.8.3"
joblib = ">=1.6.0"
scikit-learn = ">=1.9.1"
torch = ">=2.15.0"
safetensors = ">=0.8.0"
# Trading Venues:
# NOTE: trading venues are plugins, each one is a separate package named `pfund-xxx`.
# An extra exists here only for an OFFICIALLY SUPPORTED trading venue, and it pins a verified version:
#   pip install "pfund[bybit]"  # official, installs `pfund-bybit`
#   pip install pfund-xxx       # 3rd party, not maintained or verified by pfund
pfund-bybit = { version = ">=0.0.3", extras = ["data"] }
# pfund-hyperliquid = { version = ">=0.0.1", extras = ["data"] }
# pfund-alpaca = { version = ">=0.0.1", extras = ["data"] }
# pfund-binance = { version = ">=0.0.1", extras = ["data"] }
# pfund-okx = { version = ">=0.0.1", extras = ["data"] }

[feature.dev.pypi-dependencies]
pfund = { path = ".", editable = true }
afterpython = { version = ">=0.4.6", extras = ["marimo"] }
mtflow = { path = "../mtflow", editable = true }
memray = ">=1.19.3"

[feature.dev.dependencies]
graphviz = ">=14.1.2"
python-graphviz = ">=0.21"

[feature.test.pypi-dependencies]
pfund = { path = ".", editable = true }
pytest = ">=9.2.0"
pytest-mock = ">=3.17.0"
pytest-xdist = ">=3.8.0"
pytest-asyncio = ">=1.4.1"
pytest-timeout = ">=2.4.0"
# pytest-cov = ">=7.1.0"
# pytest-markdown-docs = ">=0.9.2"
# testcontainers = ">=4.14.2"
[feature.test.tasks]
test = "pytest"
test-new = "pytest --record-mode=all"  # record new interactions, useful to update recordings in case data formats returned have changed
test-ci = "pytest --record-mode=none"  # fail a test if no recording is found

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[feature.py315.dependencies]
python = "3.15.*"
