default_install_hook_types:
- pre-commit
- commit-msg
- pre-push
- post-checkout
exclude: ^afterpython/_website/
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
    stages:
    - pre-commit
  - id: end-of-file-fixer
    stages:
    - pre-commit
  - id: check-yaml
    stages:
    - pre-commit
  - id: check-toml
    stages:
    - pre-commit
  - id: check-added-large-files
    stages:
    - pre-commit
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.12
  hooks:
  # TODO: re-enable it when ready
  # - id: ruff-check
  #   stages:
  #   - pre-commit
  #   args:
  #   - --config
  #   - ./afterpython/ruff.toml
  - id: ruff-format
    stages:
    - pre-commit
    args:
    - --config
    - ./afterpython/ruff.toml
# NOTE: buggy commitizen, skip it, not useful anyways
# - repo: https://github.com/commitizen-tools/commitizen
#   rev: v4.16.0
#   hooks:
#   - id: commitizen
#     stages:
#     - commit-msg
#   - id: commitizen-branch
#     stages:
#     - pre-push
- repo: local
  hooks:
  # runs after `git worktree add` (also used by Zed) and every `git switch`;
  # the script is a no-op for the main checkout and idempotent otherwise.
  # resolved via the main checkout, so it works even if the worktree's commit doesn't have it
  - id: worktree-symlinks
    name: worktree symlinks
    entry: sh -c '"$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")/scripts/worktree-symlinks.sh" "$PWD"'
    language: system
    pass_filenames: false
    always_run: true
    stages:
    - post-checkout
