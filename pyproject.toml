[project]
name = "pfund"
version = "0.0.25"
description = "A Complete Algo-Trading Framework for Machine Learning, enabling trading across TradFi, CeFi and DeFi. Supports Vectorized and Event-Driven Backtesting, Paper and Live Trading"
license = "Apache-2.0"
authors = [
    {name = "Stephen Yau", email = "softwareentrepreneer+pfund@gmail.com"}
]
readme = "README.md"
keywords = ["trading", "algo-trading", "stocks", "cryptos", "cryptocurrencies", "TradFi", "CeFi", "DeFi", "backtesting", "machine learning"]
classifiers = [
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Information Technology",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.13"
dependencies = [
    "pfund-blocks>=0.0.1",
    "pfund-kit>=0.1.22",
    'pfeed>=0.0.20',
    "apscheduler>=3.11.3",
]

[project.optional-dependencies]
core = [
    # "mtflow>=0.0.1.dev2"
    "numba>=0.68.0",
    "ray[default]>=2.59.0",
]
ta-lib = ["ta-lib>=0.8.2"]
sklearn = [
    "joblib>=1.6.0",
    "scikit-learn>=1.9.1",
]
torch = [
    "torch>=2.14.1",
    "safetensors>=0.8.0",
]
# hyperliquid = ["pfund-hyperliquid>=0.0.1", "pfeed-hyperliquid>=..."]
# bybit = ["pfund-bybit>=...", "pfeed-bybit>=..."]

[project.scripts]
pfund = "pfund.__main__:run_cli"

[project.entry-points."pfund_shell.commands"]
pfund = "pfund.cli:pfund_group"

[project.urls]
homepage = "https://pfund.pfund.ai"
repository = "https://github.com/PFund-Software-Ltd/pfund"
documentation = "https://pfund.pfund.ai/doc"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# FIXME: set it back to "14 days" when the package is stable
exclude-newer = "0 days"
exclude-newer-package = { uv_build = false, pfund-blocks = false, pfund-kit = false, pfeed = false, mtflow = false }

[tool.uv.build-backend]
module-name = "pfund"
module-root = "src"

[tool.pytest.ini_options]
markers = [
    "smoke: Run the most important tests",
]
addopts = [
    "--strict-markers",
]
