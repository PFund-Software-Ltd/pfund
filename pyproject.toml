[project]
name = "pfund"
version = "0.0.25"
description = "A Complete Algo-Trading Framework for Machine Learning, enabling trading across TradFi, CeFi and DeFi. Supports Vectorized and Event-Driven Backtesting, Paper and Live Trading"
license = "Apache-2.0"
authors = [
    {name = "Stephen Yau", email = "softwareentrepreneer+pfund@gmail.com"}
]
readme = "README.md"
keywords = ["trading", "algo-trading", "stocks", "cryptos", "cryptocurrencies", "TradFi", "CeFi", "DeFi", "backtesting", "machine learning"]
classifiers = [
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Information Technology",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.13"
dependencies = [
    "pfeed>=0.0.23",
    # "mtflow>=0.0.1.dev2",
    "apscheduler>=3.11.3",
    "numba>=0.68.1",
]

[project.optional-dependencies]
ray = ["pfeed[ray]>=0.0.23; python_version < '3.15'"]
ta-lib = ["ta-lib>=0.8.3"]
sklearn = [
    "joblib>=1.6.0",
    "scikit-learn>=1.9.1",
]
torch = [
    "torch>=2.15.0",
    "safetensors>=0.8.0",
]
# Trading Venues:
# NOTE: trading venues are plugins, each one is a separate package named `pfund-xxx`.
# An extra exists here only for an OFFICIALLY SUPPORTED trading venue, and it pins a verified version:
#   pip install "pfund[bybit]"  # official, installs `pfund-bybit`
#   pip install pfund-xxx       # 3rd party, not maintained or verified by pfund
# hyperliquid = ["pfund-hyperliquid>=0.0.1", "pfeed[hyperliquid]>=..."]
bybit = ["pfund-bybit>=0.0.1", "pfeed-bybit>=0.0.1"]

[project.scripts]
pfund = "pfund.__main__:run_cli"

[project.entry-points."pfund_shell.commands"]
pfund = "pfund.cli:pfund_group"

[project.urls]
homepage = "https://pfund.pfund.ai"
repository = "https://github.com/PFund-Software-Ltd/pfund"
documentation = "https://pfund.pfund.ai/doc"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# FIXME: set it back to "14 days" when the package is stable
exclude-newer = "0 days"
exclude-newer-package = { uv_build = false, pfund-blocks = false, pfund-kit = false, pfeed = false, mtflow = false }

[tool.uv.build-backend]
module-name = "pfund"
module-root = "src"

[tool.pytest.ini_options]
markers = [
    "smoke: Run the most important tests",
]
addopts = [
    "--strict-markers",
]
